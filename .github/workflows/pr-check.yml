name: pr-check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --watchAll=false

      - name: Run server tests
        run: npm run test:server

      # Typechecks the app as well as building it. Without this, a breaking change to a
      # shared type only fails CI if some test happens to import the file that uses it.
      - name: Build
        run: npm run build
